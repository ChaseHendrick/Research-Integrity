name: Release

# Push a tag vX.Y.Z on a commit that is on main. This workflow runs the checks on
# that commit, builds the zip there, publishes it, then downloads the published
# file and fails unless it is byte for byte the zip it built.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: The tag is the release version
        run: |
          version=$(python3 -c "import json; print(json.load(open('plugins/research-integrity/.claude-plugin/plugin.json'))['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match plugin version $version"
            exit 1
          fi

      - run: python3 scripts/validate.py
      - run: python3 scripts/checks/phrases.py --self-test
      - run: python3 docs/case-study/code/check_numbers.py
      - run: python3 scripts/gate.py

      - name: Release notes from the changelog
        run: |
          python3 - "${GITHUB_REF_NAME#v}" > notes.md <<'PY'
          import re, sys
          text = open("CHANGELOG.md").read()
          m = re.search(rf"^## {re.escape(sys.argv[1])} \(.*?\)\n(.*?)(?=^## |\Z)", text, re.M | re.S)
          if not m:
              sys.exit(f"CHANGELOG.md has no section for {sys.argv[1]}")
          print(m.group(1).strip())
          PY

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/research-integrity.zip \
            --verify-tag --title "research-integrity ${GITHUB_REF_NAME#v}" --notes-file notes.md

      - name: The published zip is the zip that was checked
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern research-integrity.zip --dir downloaded
          python3 scripts/gate.py --compare downloaded/research-integrity.zip
